<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutschkurs</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d8;--ok:#2e8b57;--wa:#d98e04;--er:#d6362b;--ac:#1f5fbf;--hol:#ecebe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#212120;--tx:#f0efe9;--mu:#9a988f;--bd:#33332f;--ok:#4cc27f;--wa:#f0b429;--er:#ff6b5e;--ac:#6ea3ff;--hol:#2a2a28}}
:root[data-theme="dark"]{--bg:#151514;--card:#212120;--tx:#f0efe9;--mu:#9a988f;--bd:#33332f;--ok:#4cc27f;--wa:#f0b429;--er:#ff6b5e;--ac:#6ea3ff;--hol:#2a2a28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 260px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 14px}
h1{font-size:19px;margin:0}
.lg{display:flex;gap:4px}.lg button{padding:6px 8px;font-size:13px}.lg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:40px;font-weight:700;line-height:1}
.mu{color:var(--mu);font-size:14px}
.barw{position:relative;margin:12px 0 4px}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.5}
.tl{position:relative;height:16px;font-size:11px;color:var(--mu);margin-bottom:6px}.tl span{position:absolute;transform:translateX(-50%)}
#msg{font-weight:600;border-left:4px solid var(--ok);padding:6px 10px;border-radius:6px}
#msg.zy{background:rgba(217,142,4,.14)}#msg.zo{background:rgba(240,122,26,.15)}#msg.zr{background:rgba(214,54,43,.17)}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--tx)}
button{cursor:pointer;font-weight:600}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.stat:last-child{border:0}.stat b{text-align:right}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.grid .h{text-align:center;font-size:12px;color:var(--mu)}
.c{aspect-ratio:1;border-radius:8px;border:1px solid var(--bd);padding:2px 3px;font-size:13px;cursor:pointer;background:var(--card);color:var(--tx);font-weight:400;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.c small{font-size:10px;color:var(--mu);align-self:flex-end}
.c.off{background:var(--hol);color:var(--mu);border-color:transparent;cursor:default}
.c.hol{background:repeating-linear-gradient(45deg,var(--hol),var(--hol) 4px,transparent 4px,transparent 8px);border-color:transparent;cursor:default;color:var(--mu)}
.c.a{background:var(--ok);color:#fff;border-color:var(--ok)}.c.m{background:var(--er);color:#fff;border-color:var(--er)}
.c.p{background:var(--wa);color:#fff;border-color:var(--wa)}.c.x{background:var(--ac);color:#fff;border-color:var(--ac)}
.c.a small,.c.m small,.c.p small,.c.x small{color:#fff}
.c.today{outline:2px solid var(--tx)}.c.sel{box-shadow:0 0 0 3px var(--ac)}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
#sheet .in{max-width:480px;margin:0 auto}
.r{display:flex;gap:8px;margin-top:8px}.r>*{flex:1}
</style></head><body>
<main>
<div class="hd"><h1>🇩🇪 <span data-t="title"></span></h1>
<div class="lg"><button data-l="ru">RU</button><button data-l="uk">UA</button><button data-l="de">DE</button></div></div>
<div class="card">
  <label class="mu" for="st" data-t="start"></label>
  <input type="date" id="st" style="width:100%;margin-top:6px">
  <div class="mu" id="endinfo" style="margin-top:8px"></div>
  <div class="mu" id="sv" style="margin-top:6px;font-size:12px"></div>
</div>
<div id="app" style="display:none">
<div class="card">
  <div class="mu" data-t="missed"></div>
  <div class="big"><span id="ue">0</span> <span class="mu" style="font-size:18px" data-t="of"></span></div>
  <div class="barw"><div class="bar"><i id="fill"></i></div><b class="tk" style="left:50%"></b></div>
  <div class="tl"><span style="left:50%">15%</span><span style="right:0;transform:none">30%</span></div>
  <div id="msg"></div>
</div>
<div class="card" id="stats"></div>
<div class="card"><b data-t="cal"></b>
  <div class="leg" style="margin-top:6px"><span><i style="background:var(--ok)"></i><span data-t="l1"></span></span><span><i style="background:var(--er)"></i><span data-t="l2"></span></span><span><i style="background:var(--wa)"></i><span data-t="l3"></span></span><span><i style="background:var(--ac)"></i><span data-t="l4"></span></span><span><i style="background:var(--hol)"></i><span data-t="l5"></span></span></div>
  <div class="mu" style="margin-top:6px" data-t="hint"></div>
  <div id="cal"></div>
  <button id="bulk" style="width:100%;margin-top:12px" data-t="bulk"></button>
</div>
</div>
<div class="card"><b data-t="bk"></b>
  <div class="mu" style="margin-top:4px" data-t="bkd"></div>
  <textarea id="bk" rows="3" style="width:100%;margin-top:8px;font:12px monospace;border-radius:10px;border:1px solid var(--bd);padding:8px;background:var(--card);color:var(--tx)"></textarea>
  <div class="r"><button id="exp" data-t="exp"></button><button id="imp" data-t="imp"></button></div></div>
<p class="mu" data-t="foot"></p>
</main>
<div id="sheet"><div class="in">
  <b id="sd"></b>
  <div class="r"><button id="b_a" data-t="ba"></button><button id="b_m" data-t="bm"></button></div>
  <div class="r"><input type="number" id="pn" min="1" max="3" value="1" inputmode="numeric" aria-label="UE"><button id="b_p" style="flex:3" data-t="bp"></button></div>
  <div class="r"><button id="b_x" data-t="bx"></button></div>
  <div class="r"><button id="b_r" data-t="br"></button><button id="b_c" data-t="bc"></button></div>
</div></div>

try{var sl=localStorage.getItem(LK);if(T[sl])L=sl;}catch(e){}
function $(i){return document.getElementById(i)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmt(s){return s.split("-").reverse().join(".")}
function isHol(s){return HOL.some(function(h){return s>=h[0]&&s<=h[1]})}

      cells+='<button class="'+cl+'" data-d="'+k+'">'+dn+'<small>'+lab+'</small></button>'}
    h+='<div style="margin-top:14px"><b>'+t.mo[mo]+' '+y+'</b> <span class="mu">· '+tpl(t.mi,{c:cd,u:cd*4,a:ca})+'</span></div><div class="grid">'+t.wd.map(function(x){return '<div class="h">'+x+'</div>'}).join("")+cells+'</div>';
    mo++;if(mo>11){mo=0;y++}}
  $("cal").innerHTML=h;
  var cs=document.querySelectorAll(".c[data-d]");
  for(var j=0;j<cs.length;j++)(function(b){if(b.classList.contains("off")||b.classList.contains("hol"))return;
    b.onclick=function(){sel=b.getAttribute("data-d");$("sd").textContent=fmt(sel);$("sheet").style.display="block";render()}})(cs[j]);
}

document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){L=b.getAttribute("data-l");try{localStorage.setItem(LK,L)}catch(e){}applyT();render()}});
